media:
  input: public/images
  output: /images

content:
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    filename: "{title}.md"

    view:
      primary: title
      fields:
        - title
        - year
        - featured
        - background

    fields:
      - name: title
        label: Project title
        type: string
        required: true

      - name: description
        label: Short description
        type: text
        required: true

      - name: client
        label: Client
        type: string

      - name: coverImage
        label: Cover image
        type: image
        required: true

      - name: coverAlt
        label: Cover image alt text
        type: string
        description: Describe the image for accessibility.

      - name: year
        label: Year
        type: string
        required: true

      - name: role
        label: Role
        type: string
        required: true

      - name: tags
        label: Tags
        type: string
        list: true

      - name: order
        label: Display order
        type: number

      - name: featured
        label: Featured on homepage
        type: boolean
        default: false
        description: Show this project as a featured card on the homepage.

      - name: background
        label: Featured card background
        type: select
        description: Only used when "Featured on homepage" is enabled.
        options:
          placeholder: Select a card color
          values:
            - name: lime
              label: Lime
            - name: cyan
              label: Cyan
            - name: lavender
              label: Lavender
            - name: mint
              label: Mint

      - name: body
        label: Case study
        type: rich-text